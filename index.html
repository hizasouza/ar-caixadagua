<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Três Caixas d'Água - Realidade Aumentada</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script src="https://unpkg.com/aframe-troika-text/dist/aframe-troika-text.min.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  /* Tela inicial */
  #start-screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #000;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
  }

  #start-screen h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.02em;
    margin-bottom: 12px;
    text-transform: uppercase;
  }

  #start-screen p {
    font-size: 15px;
    color: #b8b8b8;
    max-width: 320px;
    line-height: 1.5;
    margin-bottom: 32px;
  }

  #start-btn {
    background: #fff;
    color: #000;
    border: none;
    padding: 16px 40px;
    font-size: 16px;
    font-weight: 800;
    border-radius: 4px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
  }

  #start-btn:active { opacity: 0.7; }

  /* Indicador de busca */
  #scan-hint {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    background: rgba(0,0,0,0.75);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 10px 20px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: opacity 0.3s ease;
  }

  #scan-hint .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fff;
    animation: pulse 1.2s infinite ease-in-out;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>

<div id="start-screen">
  <h1>Três Caixas d'Água</h1>
  <p>Aponte a câmera para a peça da escultura para revelar a história por trás dela.</p>
  <button id="start-btn">Abrir câmera</button>
</div>

<div id="scan-hint" style="display:none;">
  <span class="dot"></span>
  Procurando a imagem&hellip;
</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 10; warmupTolerance: 2; missTolerance: 8;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-entity id="ar-content" position="0 -0.75 0">
      <a-plane
        color="#000000"
        opacity="0.88"
        width="1.5"
        height="1.15"
        position="0 -0.5 -0.02"
      ></a-plane>

      <a-entity
        troika-text="value: AS TRÊS CAIXAS D'ÁGUA;
          color: #FFFFFF;
          font: https://raw.githubusercontent.com/googlefonts/roboto-2/main/src/hinted/Roboto-Bold.ttf;
          fontSize: 0.09;
          align: center;
          anchor: center;
          baseline: center;
          maxWidth: 1.3;
          letterSpacing: 0.005;"
        position="0 -0.14 0"
      ></a-entity>

      <a-entity
        troika-text="value: As Três Caixas D'Água, conhecidas como 'As Três Marias', são o principal símbolo cultural de Porto Velho. Importadas dos Estados Unidos no início do século XX, elas foram fundamentais para abastecer a população pioneira que surgia na região. Hoje, já desativadas, as imponentes estruturas de aço estão instaladas no centro da cidade, preservando a memória da corrida da borracha e o nascimento do estado.;
          color: #FFFFFF;
          font: https://raw.githubusercontent.com/googlefonts/roboto-2/main/src/hinted/Roboto-Bold.ttf;
          fontSize: 0.052;
          align: center;
          anchor: center;
          baseline: center;
          maxWidth: 1.35;
          lineHeight: 1.4;"
        position="0 -0.62 0"
      ></a-entity>
    </a-entity>
  </a-entity>
</a-scene>

<script>
  const sceneEl = document.querySelector('a-scene');
  const startScreen = document.getElementById('start-screen');
  const startBtn = document.getElementById('start-btn');
  const scanHint = document.getElementById('scan-hint');
  const targetEntity = document.getElementById('target');

  startBtn.addEventListener('click', () => {
    startScreen.style.display = 'none';
    scanHint.style.display = 'flex';
  });

  sceneEl.addEventListener('arError', (e) => {
    console.error('MindAR error:', e.detail);
    alert('Erro ao iniciar a câmera: ' + JSON.stringify(e.detail));
  });

  targetEntity.addEventListener('targetFound', () => {
    scanHint.style.display = 'none';
  });

  targetEntity.addEventListener('targetLost', () => {
    scanHint.style.display = 'flex';
  });
</script>

</body>
</html>
