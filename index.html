<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Três Caixas d'Água - Realidade Aumentada</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  /* Tela inicial */
  #start-screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #000;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
  }

  #start-screen h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.02em;
    margin-bottom: 12px;
    text-transform: uppercase;
  }

  #start-screen p {
    font-size: 15px;
    color: #b8b8b8;
    max-width: 320px;
    line-height: 1.5;
    margin-bottom: 32px;
  }

  #start-btn {
    background: #fff;
    color: #000;
    border: none;
    padding: 16px 40px;
    font-size: 16px;
    font-weight: 800;
    border-radius: 4px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
  }

  #start-btn:active { opacity: 0.7; }

  /* Indicador de busca */
  #scan-hint {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    background: rgba(0,0,0,0.75);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 10px 20px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: opacity 0.3s ease;
  }

  #scan-hint .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fff;
    animation: pulse 1.2s infinite ease-in-out;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>

<div id="start-screen">
  <h1>Três Caixas d'Água</h1>
  <p>Aponte a câmera para a peça da escultura para revelar a história por trás dela.</p>
  <button id="start-btn">Abrir câmera</button>
</div>

<div id="scan-hint" style="display:none;">
  <span class="dot"></span>
  Procurando a imagem&hellip;
</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-entity id="ar-content" position="0 -0.75 0">
      <a-plane
        color="#000000"
        opacity="0.88"
        width="1.5"
        height="1.5"
        position="0 -0.75 -0.02"
      ></a-plane>

      <a-text
        value="AS TRÊS CAIXAS D'ÁGUA"
        color="#FFFFFF"
        font="exo2bold"
        align="center"
        anchor="center"
        width="1.4"
        wrap-count="22"
        position="0 -0.12 0"
      ></a-text>

      <a-text
        value="No coração de Porto Velho, três imponentes torres de ferro testemunham o nascimento de um estado. Conhecidas como as 'Três Caixas d'Água', essas estruturas são os maiores símbolos da identidade rondoniense, erguidas entre 1910 e 1912 para abastecer a população durante a construção da lendária Estrada de Ferro Madeira-Mamoré."
        color="#FFFFFF"
        font="exo2bold"
        align="center"
        anchor="center"
        width="1.35"
        wrap-count="38"
        line-height="46"
        position="0 -0.58 0"
      ></a-text>

      <a-text
        value="Fabricadas nos Estados Unidos pela Chicago Bridge & Iron Works, as peças atravessaram o oceano para serem montadas no topo de uma colina. Cada reservatório tem capacidade para 200 mil litros e, por gravidade, abasteceu a capital até 1957."
        color="#FFFFFF"
        font="exo2bold"
        align="center"
        anchor="center"
        width="1.35"
        wrap-count="38"
        line-height="46"
        position="0 -1.28 0"
      ></a-text>
    </a-entity>
  </a-entity>
</a-scene>

<script>
  const sceneEl = document.querySelector('a-scene');
  const startScreen = document.getElementById('start-screen');
  const startBtn = document.getElementById('start-btn');
  const scanHint = document.getElementById('scan-hint');
  const targetEntity = document.getElementById('target');

  startBtn.addEventListener('click', () => {
    startScreen.style.display = 'none';
    scanHint.style.display = 'flex';
  });

  sceneEl.addEventListener('arError', (e) => {
    console.error('MindAR error:', e.detail);
    alert('Erro ao iniciar a câmera: ' + JSON.stringify(e.detail));
  });

  targetEntity.addEventListener('targetFound', () => {
    scanHint.style.display = 'none';
  });

  targetEntity.addEventListener('targetLost', () => {
    scanHint.style.display = 'flex';
  });
</script>

</body>
</html>
